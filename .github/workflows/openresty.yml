name: openresty

on:
  push:
    branches: [master]
    paths: ["openresty/**", ".github/workflows/openresty.yml"]
  pull_request:
    paths: ["openresty/**", ".github/workflows/openresty.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: openresty

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: JSON
        run: |
          for f in config/*.json tests/config/*.json; do
            python3 -m json.tool "$f" >/dev/null || { echo "invalid: $f"; exit 1; }
          done

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lua unit tests
        run: tests/unit.sh

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull images
        run: |
          docker compose --env-file tests/test.env \
            -f docker-compose.yml -f tests/docker-compose.test.yml pull --quiet
      - name: End-to-end tests
        run: DEBUG=1 tests/e2e.sh
