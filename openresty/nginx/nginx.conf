worker_processes auto;
error_log /dev/stderr warn;

env PROXY_DOMAIN;
env VIA_PROVIDERS;
env VIA_LOG_KEY;
env VIA_RELOAD_INTERVAL;

events {
    worker_connections 4096;
}

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;

    lua_package_path "/etc/via/lua/?.lua;;";
    # usage counters and blocks (via.limits), roughly 4 KB per active user
    lua_shared_dict via_limits 50m;
    init_by_lua_block {
        require("via.config").init()
        -- preload modules in the master process
        require("via.handler")
        require("via.login")
        require("via.health")
    }
    # pick up changes to providers.json without a restart
    init_worker_by_lua_block { require("via.config").watch() }

    # DNS for upstream providers (proxy_pass uses variables)
    include /etc/via/nginx/resolver.conf;
    # campus networks: $via_campus = 1 bypasses the proxy
    include /etc/via/nginx/campus.conf;

    # $via_user_hash: HMAC of the OIDC user id (pseudonym, see VIA_LOG_KEY)
    log_format via '$remote_addr $via_user_hash [$time_local] "$request" '
                   '$status $body_bytes_sent $via_provider "$host" '
                   '"$via_upstream_host" "$http_user_agent"';
    access_log /dev/stdout via;

    # providers send big cookies, keep headers from overflowing
    large_client_header_buffers 8 64k;
    proxy_buffer_size 64k;
    proxy_buffers 32 64k;
    proxy_busy_buffers_size 128k;
    client_max_body_size 100m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json
               application/xml application/xhtml+xml image/svg+xml;

    ssl_certificate     /etc/via/certs/fullchain.pem;
    ssl_certificate_key /etc/via/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;

    # oauth2-proxy, resolved per request via the resolver: a static upstream
    # would be resolved at startup/reload and fail with "host not found"
    # while the oauth2-proxy container is restarting
    map $host $via_oauth2 {
        default "oauth2-proxy:4180";
    }

    server {
        listen 80 default_server;
        server_name _;
        set $via_upstream_host "-";
        set $via_provider "-";
        set $via_user_hash "-";

        # ACME http-01 / webroot (scripts/setup_acme.sh, ACME_CHALLENGE=webroot)
        location /.well-known/acme-challenge/ {
            root /etc/via/acme;
            default_type text/plain;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # login.<proxy_domain>: OIDC login, starting-point URLs, provider menu
    server {
        listen 443 ssl;
        http2 on;
        server_name ~^login\.;

        set $via_upstream_host "-";
        set $via_provider "-";
        set $via_user_hash "-";

        location /oauth2/ {
            proxy_pass http://$via_oauth2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Uri $request_uri;
        }

        # EZproxy-compatible: /login?url=https://www.jstor.org/...
        location = /login {
            content_by_lua_block { require("via.login").start() }
        }

        location = / {
            content_by_lua_block { require("via.login").menu() }
        }

        # oauth2-proxy liveness, used by /health
        location = /_via_ping {
            internal;
            proxy_pass http://$via_oauth2/ping;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        location = /health {
            access_log off;
            content_by_lua_block { require("via.health").health() }
        }

        location / {
            return 404;
        }
    }

    # admin API (limits, status, health); published on 127.0.0.1 only (compose)
    server {
        listen 8081;
        server_name _;
        set $via_upstream_host "-";
        set $via_provider "-";
        set $via_user_hash "-";

        location = /limits {
            content_by_lua_block {
                require("via.limits").admin(require("via.config").current)
            }
        }

        location = /status {
            content_by_lua_block { require("via.health").status() }
        }

        # oauth2-proxy liveness, used by /health
        location = /_via_ping {
            internal;
            proxy_pass http://$via_oauth2/ping;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        location = /health {
            access_log off;
            content_by_lua_block { require("via.health").health() }
        }
        location / {
            return 404;
        }
    }

    # <encoded-host>.<proxy_domain>: the providers
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        # session check, answered by oauth2-proxy from the SSO cookie
        location = /_via_auth {
            internal;
            proxy_pass http://$via_oauth2/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Uri $request_uri;
        }

        location @via_login {
            content_by_lua_block { require("via.handler").login_redirect() }
        }

        location / {
            # Set here and not at server level: the auth_request subrequest
            # shares variables with the main request and would run
            # server-level "set" again, wiping the values from rewrite().
            set $via_upstream_host "";
            set $via_scheme "https";
            set $via_provider "-";
            set $via_user_hash "-";
            set $via_cookie "";
            set $via_referer "";
            set $via_origin "";
            rewrite_by_lua_block { require("via.handler").rewrite() }

            auth_request /_via_auth;
            auth_request_set $via_user $upstream_http_x_auth_request_user;
            error_page 401 = @via_login;
            # runs after auth_request: usage limits need the user
            access_by_lua_block { require("via.handler").access() }

            proxy_pass $via_scheme://$via_upstream_host;
            proxy_http_version 1.1;
            proxy_set_header Host $via_upstream_host;
            proxy_set_header Connection "";
            # cleaned in via.handler.rewrite(); empty values are not sent
            proxy_set_header Cookie $via_cookie;
            proxy_set_header Referer $via_referer;
            proxy_set_header Origin $via_origin;
            # mod_substitute lesson: rewriting needs uncompressed bodies
            proxy_set_header Accept-Encoding "";
            proxy_redirect off;

            proxy_ssl_server_name on;
            proxy_ssl_name $via_upstream_host;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

            header_filter_by_lua_block { require("via.handler").header_filter() }
            body_filter_by_lua_block { require("via.handler").body_filter() }
            log_by_lua_block { require("via.handler").log() }
        }
    }
}
