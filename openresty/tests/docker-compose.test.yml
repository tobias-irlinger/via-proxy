# Test overlay: mock OIDC IdP and a fake publisher.
#   docker compose --env-file tests/test.env \
#       -f docker-compose.yml -f tests/docker-compose.test.yml up -d
services:
  oauth2-proxy:
    depends_on:
      - mock-idp

  mock-idp:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: '{"interactiveLogin": true}'
    networks:
      default:
        aliases: [mock-idp]

  upstream:
    image: openresty/openresty:1.27.1.2-bookworm
    volumes:
      - ./tests/upstream/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    networks:
      default:
        aliases:
          - www.example-publisher.test
          - cdn.example-publisher.test
