# Fake publisher for the end-to-end test (plain http, see providers.test.json).
events {}
http {
    server {
        listen 80;
        server_name www.example-publisher.test;

        location = / {
            default_type text/html;
            add_header Set-Cookie "session=abc; Domain=.example-publisher.test; Path=/; Secure; HttpOnly";
            add_header Set-Cookie "hostonly=1; Path=/";
            add_header Content-Security-Policy "default-src 'self'";
            return 200 '<html><body>
<a id="abs" href="https://www.example-publisher.test/article/1">abs</a>
<a id="http" href="http://www.example-publisher.test/article/2">http</a>
<script id="cdn" src="//cdn.example-publisher.test/app.js" integrity="sha384-xyz" crossorigin="anonymous"></script>
<script>var api = "https:\/\/www.example-publisher.test\/api";</script>
<a id="foreign" href="https://unknown.example.net/">foreign</a>
</body></html>';
        }

        location = /redirect {
            return 302 https://cdn.example-publisher.test/file.pdf;
        }

        location = /doc.pdf {
            default_type application/pdf;
            return 200 '%PDF-1.4 test';
        }

        location = /export {
            default_type text/plain;
            add_header Content-Disposition 'attachment; filename="refs.ris"';
            return 200 'TY  - JOUR';
        }

        # 600 KB, not a download type: only counts towards the volume limit
        location = /big {
            default_type text/plain;
            content_by_lua_block { ngx.print(string.rep("x", 600 * 1024)) }
        }

        # echoes what the upstream receives
        location = /echo {
            default_type text/plain;
            return 200 'host=$host
cookie=$http_cookie
referer=$http_referer
accept_encoding=$http_accept_encoding
';
        }
    }

    server {
        listen 80;
        server_name cdn.example-publisher.test;
        location / {
            default_type text/plain;
            return 200 'cdn cookie=$http_cookie
';
        }
    }
}
